services:
  postgres:
    image: postgres:16-alpine
    container_name: placement-db
    environment:
      POSTGRES_USER: placement
      POSTGRES_PASSWORD: placement123
      POSTGRES_DB: placement_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: placement-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
